<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بطاقة العضوية الرقمية | بوابة المحقق الرقمي</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
background:#0f172a;
font-family:Cairo,sans-serif;
color:#fff;
margin:0;
padding:40px;
}

.profile-card{

max-width:700px;
margin:auto;
background:#1e293b;
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:0 0 25px rgba(0,255,255,.25);

}

.profile-card img{

width:180px;
height:180px;
border-radius:50%;
border:5px solid #00e5ff;
object-fit:cover;

}

.profile-card h1{

margin:20px 0 10px;
font-size:32px;

}

.badge{

display:inline-block;
background:#00bcd4;
padding:10px 22px;
border-radius:30px;
font-weight:bold;
margin-bottom:20px;

}

.info{

text-align:right;
margin-top:25px;

}

.info p{

font-size:18px;
padding:12px 0;
border-bottom:1px solid #334155;

}

.btn{

display:inline-block;
margin-top:30px;
padding:14px 30px;
background:#00bcd4;
color:white;
text-decoration:none;
border-radius:10px;
font-size:18px;

}

.btn:hover{

background:#0097a7;

}

</style>

</head>

<body>

<div class="profile-card">

<img id="photo" src="images/default-user.png" alt="الصورة الشخصية">

<h1 id="fullname">عضو جديد</h1>

<div class="badge">
بطاقة العضوية الرقمية
</div>

<div class="info">

<p><strong>رقم العضوية:</strong> <span id="memberid"></span></p>

<p><strong>اسم المستخدم:</strong> <span id="username"></span></p>

<p><strong>البريد الإلكتروني:</strong> <span id="email"></span></p>

<p><strong>رقم الهاتف:</strong> <span id="phone"></span></p>

<p><strong>الدولة:</strong> <span id="country"></span></p>

<p><strong>المدينة:</strong> <span id="city"></span></p>

<p><strong>التخصص:</strong> <span id="specialization"></span></p>

<p><strong>حالة الحساب:</strong> عضو جديد</p>

<p><strong>المنصة:</strong> بوابة المحقق الرقمي</p>

</div>

<a href="index.html" class="btn">
العودة للرئيسية
</a>

</div>

<script>

const data = new URLSearchParams(window.location.search);

document.getElementById("fullname").textContent =
data.get("fullname") || "عضو جديد";

document.getElementById("username").textContent =
data.get("username") || "-";

document.getElementById("email").textContent =
data.get("email") || "-";

document.getElementById("phone").textContent =
data.get("phone") || "-";

document.getElementById("country").textContent =
data.get("country") || "-";

document.getElementById("city").textContent =
data.get("city") || "-";

document.getElementById("specialization").textContent =
data.get("specialization") || "-";

document.getElementById("memberid").textContent =
"DIP-" + Math.floor(Math.random() * 900000 + 100000);

</script>

</body>

</html>
