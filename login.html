<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول | بوابة المحقق الرقمي</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{

background:#050816;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

font-family:Cairo,sans-serif;

}

.login-box{

width:420px;

background:#101b2c;

padding:40px;

border-radius:20px;

border:1px solid rgba(255,255,255,.08);

box-shadow:0 0 40px rgba(0,229,255,.15);

}

.logo{

text-align:center;

margin-bottom:35px;

}

.logo i{

font-size:65px;

color:#00e5ff;

}

.logo h2{

margin-top:15px;

font-weight:900;

color:white;

}

.form-control{

background:#08111d;

border:1px solid rgba(255,255,255,.08);

color:white;

height:52px;

}

.form-control:focus{

background:#08111d;

color:white;

border-color:#00e5ff;

box-shadow:none;

}

.btn-login{

width:100%;

height:55px;

background:#00bfff;

border:none;

font-size:18px;

font-weight:bold;

margin-top:20px;

}

.btn-login:hover{

background:#009fe0;

}

.text-link{

text-align:center;

margin-top:20px;

}

.text-link a{

color:#00e5ff;

text-decoration:none;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">

<i class="fa-solid fa-shield-halved"></i>

<h2>بوابة المحقق الرقمي</h2>

<p>تسجيل الدخول إلى لوحة التحكم</p>

</div>

<form action="dashboard.html">

<div class="mb-3">

<label class="mb-2">البريد الإلكتروني</label>

<input type="email" class="form-control" placeholder="name@example.com" required>

</div>

<div class="mb-3">

<label class="mb-2">كلمة المرور</label>

<input type="password" class="form-control" placeholder="********" required>

</div>

<div class="form-check mb-3">

<input class="form-check-input" type="checkbox">

<label class="form-check-label">

تذكرني

</label>

</div>

<button class="btn btn-login">

<i class="fa-solid fa-right-to-bracket"></i>

تسجيل الدخول

</button>

</form>

<div class="text-link">

<a href="register.html">

إنشاء حساب جديد

</a>

</div>

</div>

</body>

</html>
