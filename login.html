<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>تسجيل الدخول | بوابة المحقق الرقمي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<link rel="icon" type="image/png" href="file_000000003d848246aeb46c052206fa1d.png">

<meta name="description" content="تسجيل الدخول إلى بوابة المحقق الرقمي">

<style>

body{
margin:0;
font-family:Cairo,sans-serif;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.login-box{
width:90%;
max-width:420px;
background:#1e293b;
padding:35px;
border-radius:20px;
box-shadow:0 0 30px rgba(0,229,255,.25);
text-align:center;
}

.login-box img{
width:90px;
margin-bottom:15px;
}

.login-box h2{
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin:12px 0;
border:none;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#00bcd4;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0097a7;
}

a{
color:#00e5ff;
text-decoration:none;
}

.footer{
margin-top:20px;
font-size:15px;
color:#bbb;
}

</style>

</head>

<body>

<div class="login-box">

<img src="file_000000003d848246aeb46c052206fa1d.png" alt="شعار البوابة">

<h2>تسجيل الدخول</h2>

<form action="dashboard.html">

<input type="text" placeholder="اسم المستخدم أو البريد الإلكتروني" required>

<input type="password" placeholder="كلمة المرور" required>

<button type="submit">
دخول
</button>

</form>

<p>
ليس لديك حساب؟
<a href="register.html">
إنشاء حساب
</a>
</p>

<div class="footer">

بوابة المحقق الرقمي<br>

© 2026 حاتم حسين الحاج رمضان

</div>

</div>

</body>

</html>
