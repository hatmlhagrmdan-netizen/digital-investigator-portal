<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إنشاء حساب | بوابة المحقق الرقمي</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Cairo,sans-serif;
background:#0f172a;
color:#fff;
}

.register-box{
max-width:500px;
margin:50px auto;
padding:30px;
background:#1e293b;
border-radius:20px;
}

.register-box h2{
text-align:center;
margin-bottom:25px;
}

input,select{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#00bcd4;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0097a7;
}

</style>

</head>

<body>

<div class="register-box">

<h2>إنشاء حساب جديد</h2>
<p style="text-align:center;color:#ccc;">
املأ البيانات التالية لإصدار بطاقة العضوية الرقمية.
</p>
<form action="profile.html" method="post" enctype="multipart/form-data">

<label>الصورة الشخصية</label>
<input type="file" name="photo" accept="image/*" required>

<label>الاسم الكامل</label>
<input type="text" name="fullname" placeholder="أدخل الاسم الكامل" required>

<label>البريد الإلكتروني</label>
<input type="email" name="email" placeholder="example@email.com" required>

<label>رقم الهاتف</label>
<input type="tel" name="phone" placeholder="+963xxxxxxxxx">

<label>الدولة</label>
<input type="text" name="country" placeholder="سوريا">

<label>المدينة</label>
<input type="text" name="city" placeholder="الرقة">

<label>التخصص</label>
<select name="specialization" required>
<option value="">اختر التخصص</option>
<option>محقق جنائي رقمي</option>
<option>خبير أمن سيبراني</option>
<option>باحث OSINT</option>
<option>محلل أدلة رقمية</option>
<option>طالب</option>
<option>أخرى</option>
</select>

<label>اسم المستخدم</label>
<input type="text" name="username" placeholder="اسم المستخدم" required>
<label>كلمة المرور</label>
<input type="password" name="password" placeholder="********" required>

<label>تأكيد كلمة المرور</label>
<input type="password" name="confirm_password" placeholder="********" required>

<label>
<input type="checkbox" name="terms" required>
أوافق على شروط الاستخدام وسياسة الخصوصية.
</label>

<button type="submit">
إنشاء الحساب وإصدار البطاقة
</button>

</form>

  <p style="text-align:center; margin-top:20px;">
لديك حساب بالفعل؟
<a href="login.html" style="color:#00e5ff; text-decoration:none;">
تسجيل الدخول
</a>
  </p>
  
</div>

</body>

</html>
