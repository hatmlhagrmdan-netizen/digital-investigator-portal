<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الإدارة | بوابة المحقق الرقمي</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<div class="dashboard">

<aside class="sidebar">

<div class="logo">

<i class="fa-solid fa-user-shield"></i>

<h3>لوحة الإدارة</h3>

</div>

<ul>

<li class="active"><i class="fa-solid fa-gauge"></i>الرئيسية</li>

<li><i class="fa-solid fa-newspaper"></i>إدارة المقالات</li>

<li><i class="fa-solid fa-graduation-cap"></i>إدارة الدورات</li>

<li><i class="fa-solid fa-toolbox"></i>إدارة الأدوات</li>

<li><i class="fa-solid fa-users"></i>المستخدمون</li>

<li><i class="fa-solid fa-comments"></i>التعليقات</li>

<li><i class="fa-solid fa-chart-column"></i>الإحصائيات</li>

<li><i class="fa-solid fa-gear"></i>الإعدادات</li>

</ul>

</aside>

<main class="content">

<header class="topbar">

<h2>لوحة التحكم الرئيسية</h2>

</header>

<section class="cards">

<div class="card-box">

<h5>المستخدمون</h5>

<h2>1,248</h2>

</div>

<div class="card-box">

<h5>المقالات</h5>

<h2>320</h2>

</div>

<div class="card-box">

<h5>الدورات</h5>

<h2>54</h2>

</div>

<div class="card-box">

<h5>الأدوات</h5>

<h2>186</h2>

</div>

</section>

<section class="recent">

<h3>إضافة مقال جديد</h3>

<form>

<div class="mb-3">

<label>عنوان المقال</label>

<input class="form-control">

</div>

<div class="mb-3">

<label>التصنيف</label>

<select class="form-select">

<option>الأمن السيبراني</option>

<option>الذكاء الاصطناعي</option>

<option>OSINT</option>

<option>الأدلة الرقمية</option>

</select>

</div>

<div class="mb-3">

<label>المحتوى</label>

<textarea class="form-control" rows="8"></textarea>

</div>

<button class="btn btn-info">

<i class="fa-solid fa-floppy-disk"></i>

حفظ المقال

</button>

</form>

</section>

</main>

</div>

<script src="js/app.js"></script>

</body>

  </html>
